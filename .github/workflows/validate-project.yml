name: Validate Nexo AI Project

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate PHP syntax
        run: |
          php -l server/api.php
          php -l server/index.php
      - name: Check required public files
        run: |
          test -f htdocs/index.html
          test -f htdocs/privacy.html
          test -f htdocs/assets/config.js
          test -f render.yaml
      - name: Reject obvious committed secrets
        shell: bash
        run: |
          if grep -RIE --exclude-dir=.git --exclude='*.md' --exclude='*.txt' '(sk-[A-Za-z0-9_-]{20,}|OPENAI_API_KEY\s*=\s*[^$[:space:]]+)' .; then
            echo 'Possível segredo encontrado no repositório.'
            exit 1
          fi
          echo 'Nenhum segredo óbvio encontrado.'
