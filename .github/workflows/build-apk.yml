name: Build Nexo AI Debug

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Corrigir recursos Android
        shell: bash
        run: |
          set -euo pipefail

          RES="android/app/src/main/res"

          fix_file() {
            SRC="$1"
            DST="$2"

            if [ -f "$SRC" ]; then
              if [ -f "$DST" ]; then
                echo "Removendo duplicado invalido: $SRC"
                rm -f "$SRC"
              else
                echo "Renomeando: $SRC -> $DST"
                mv "$SRC" "$DST"
              fi
            fi
          }

          fix_file "$RES/values/strings" "$RES/values/strings.xml"
          fix_file "$RES/xml/method" "$RES/xml/method.xml"

          for DIR in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
            fix_file "$RES/$DIR/ic_launcher" "$RES/$DIR/ic_launcher.png"
          done

          echo "===== ARQUIVOS DE RECURSOS ====="
          find "$RES" -type f | sort

          echo "===== VALIDACAO ====="
          test -f "$RES/values/strings.xml"
          test -f "$RES/xml/method.xml"
          test -f "$RES/mipmap-mdpi/ic_launcher.png"
          test -f "$RES/mipmap-hdpi/ic_launcher.png"
          test -f "$RES/mipmap-xhdpi/ic_launcher.png"
          test -f "$RES/mipmap-xxhdpi/ic_launcher.png"
          test -f "$RES/mipmap-xxxhdpi/ic_launcher.png"

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Compilar APK
        working-directory: android
        run: gradle clean assembleDebug --stacktrace --no-daemon

      - name: Verificar APK
        run: |
          test -f android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: NexoAI-Keyboard-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
